[project]
name = "cocreation-platform-api"
version = "1.0.0"
description = "共创智能体独立平台后端 API 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "python-multipart==0.0.6",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "sqlalchemy==2.0.25",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "httpx==0.26.0",
    "aiofiles>=25.1.0",
    "python-dotenv>=1.2.2",
    "openai>=1.109.1",
    "psutil>=5.9.0",
    "pexpect>=4.9.0",
    "joblib>=1.3.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.2",
    "pymysql>=1.1.0",
    "pymilvus>=2.4.0",
    "build123d==0.11.1",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "pyrender==0.1.45",
    "trimesh",
    "pyopengl==3.1.7",
    "langgraph",
    "langchain-openai",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "postgres_integration: requires TEST_POSTGRES_DATABASE_URL and a reachable PostgreSQL test database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
